name: Package

# Builds the one plugin package every platform installs: Pointy.app, built
# and signed on macOS, and Pointy.exe for Windows x64 and arm64,
# cross-compiled. Signing and notarization run only when their secrets are
# set; without them the app is signed ad hoc. Releases reach npm through
# publish.yml, which publishes the build Nagi-ovo/pointy-signed signs and
# notarizes, not this one.
#   APPLE_CERTIFICATE           base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Jane Doe (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarization, which needs the certificate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: npm ci
      - run: npm run check
      - name: Test the Go app
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
          GOOS=windows go build ./...

      - name: Import the signing certificate
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Store the notary credentials
        if: env.APPLE_CERTIFICATE != '' && env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials pointy-notary --keychain "$NOTARY_KEYCHAIN" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "APPLE_NOTARY_PROFILE=pointy-notary" >> "$GITHUB_ENV"

      - name: Pack the plugin
        run: node tools/pack-plugin.ts
      - uses: actions/upload-artifact@v5
        with:
          name: pointylab-dsh
          path: dist/*.tgz
          if-no-files-found: error

  # A release runs the desktop tests (Windows and the macOS DSH check) again
  # on the tagged commit, since only pull requests run them otherwise.
  desktop-test:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/desktop-test.yml

  # A v* tag publishes the package once both pass: the release branch, which
  # older installs (github:pointylab/pointy#release) use, gets its contents,
  # and a GitHub release gets the tgz. npm gets the signed build of the same
  # tag later, from publish.yml.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, desktop-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pointylab-dsh
          path: pkg
      - name: Unpack and check the version against the tag
        id: pkg
        run: |
          tgz=$(ls pkg/*.tgz)
          mkdir unpacked
          tar -xzf "$tgz" -C unpacked
          version=$(node -p "require('./unpacked/package/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin/package.json $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: release
          path: release
      - name: Update the release branch
        working-directory: release
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../unpacked/package/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "the release branch already holds this package"
            exit 0
          fi
          git commit -m "Release ${{ steps.pkg.outputs.version }} (built plugin package)"
          git push origin release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.tgz }}" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
