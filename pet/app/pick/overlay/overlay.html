<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #box { position: fixed; left: 0; top: 0; opacity: 0; border: 1.5px solid rgba(77, 107, 254, 0.95); background: rgba(77, 107, 254, 0.08); border-radius: 8px; box-sizing: border-box; box-shadow: 0 0 0 3px rgba(77, 107, 254, 0.16), 0 0 16px 4px rgba(77, 107, 254, 0.28); will-change: transform, width, height; }
    /* 空壳程序里跟着鼠标的小框：虚线，和大框同色 */
    #focus { position: fixed; left: 0; top: 0; opacity: 0; border: 1.5px dashed rgba(77, 107, 254, 0.95); background: rgba(77, 107, 254, 0.10); border-radius: 6px; box-sizing: border-box; pointer-events: none; will-change: transform; }
    /* 虚线小框里靠右居中的竖条：上下箭头夹着鼠标滚轮，提示滚轮能调大小 */
    #wheel { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 88px; border-radius: 14px; background: rgba(77, 107, 254, 0.55); box-shadow: 0 0 0 1px rgba(77, 107, 254, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box; color: rgba(255, 255, 255, 0.92); }
    #wheel svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-linecap: round; }
    #focus.live { transition: transform 120ms ease-out, width 120ms ease-out, height 120ms ease-out, opacity 120ms ease-out; }
    #box.live { transition: transform 170ms cubic-bezier(0.34, 1.2, 0.64, 1), width 170ms cubic-bezier(0.34, 1.2, 0.64, 1), height 170ms cubic-bezier(0.34, 1.2, 0.64, 1), opacity 120ms ease-out; }
    #what { position: fixed; display: none; padding: 2px 8px; border-radius: 6px; background: rgba(28, 32, 51, 0.86); color: #fff; font: 12px "Segoe UI", "Microsoft YaHei UI", sans-serif; white-space: nowrap; }
    /* 屏幕正下方的操作提示，和网页里的一样 */
    #pill { position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 999px; background: rgba(28, 32, 51, 0.92); color: #fff; font: 16px "Segoe UI", "Microsoft YaHei UI", sans-serif; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18); }
    kbd { font: inherit; font-size: 14px; padding: 1px 9px; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 7px; }
    #pill svg { width: 15px; height: 20px; }
  </style>
</head>
<body>
  <div id="box"></div>
  <div id="focus"><div id="wheel"><svg viewBox="0 0 16 16" stroke-width="1.6"><path d="M4 10l4-4 4 4"/></svg><svg viewBox="0 0 16 16" stroke-width="1.3"><rect x="4.5" y="1.5" width="7" height="13" rx="3.5"/><path d="M8 4v3"/></svg><svg viewBox="0 0 16 16" stroke-width="1.6"><path d="M4 6l4 4 4-4"/></svg></div></div>
  <div id="what"></div>
  <div id="pill"><svg viewBox="-1 -1 14 22"><path d="M0 0V17L4 13L7 20L10 18.7L7 12H12Z" fill="#fff"/></svg>右键 或 <kbd>Esc</kbd> 退出<span id="wheel-hint" hidden>· 滚轮 调大小</span><span id="note-hint" hidden></span></div>
  <script src="overlay.js"></script>
</body>
</html>
