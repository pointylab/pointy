<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Pointy</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>
  <!-- 看板娘：扒在卡片左边往里看；在卡片外面，所以不受卡片的 overflow 裁切 -->
  <div id="mascot" class="idle" aria-hidden="true">
    <img alt="" draggable="false">
  </div>
  <div id="card">
    <header id="drag">
      <span id="title" hidden></span>
      <span id="source"></span>
      <span class="spacer"></span>
      <button id="open-agent" class="icon" type="button" hidden>
        <svg viewBox="0 0 16 16"><path d="M6 3h7v7M13 3 4 12"/></svg>
      </button>
      <button id="close" class="icon" type="button" title="关闭（Esc）">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </header>

    <div id="shot" hidden><img alt="指到的那块的截图"><img class="wide" alt="整个区域的截图" hidden><button class="drop" type="button" title="不发这张图">×</button></div>
    <div id="quote-wrap" hidden><blockquote id="quote" title="点一下展开"></blockquote><button class="drop" type="button" title="不发这段内容">×</button></div>

    <section id="thread" hidden></section>
    <div id="activity" hidden></div>

    <div id="composer">
      <textarea id="input" rows="1" placeholder="想问点什么…"></textarea>
      <div id="suggest"></div>
      <div id="target-row">
        <span id="status" title="空闲"></span>
        <div id="target-wrap">
          <button id="target" type="button"><span id="target-label">…</span><span id="target-meta"></span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
          <div id="target-menu" hidden></div>
        </div>
        <button id="new-task" class="icon" type="button" title="改成新对话（Tab）" hidden>
          <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
        </button>
      </div>
      <div id="bar">
        <div id="model-wrap">
          <button id="model" type="button" title="这次用的模型"><span id="model-label">DeepSeek</span><svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5"/></svg></button>
          <div id="model-menu" hidden></div>
        </div>
        <div id="mode" role="radiogroup" aria-label="回答方式">
          <button type="button" data-mode="quick" title="快答：直接简短回答，不跑命令、不下载，最多搜一两次网页">快答</button>
          <button type="button" data-mode="deep" title="完整：不加限制，该查就查、该跑就跑">完整</button>
        </div>
        <span class="spacer"></span>
        <button id="send" type="button" title="发送（Enter）" disabled>
          <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
        </button>
      </div>
    </div>

    <div id="grip" title="拖动调整大小"><svg viewBox="0 0 12 12"><path d="M10 4v6H4"/></svg></div>

    <section id="pair-view" hidden>
      <p>在浏览器扩展的弹窗里输入这个配对码：</p>
      <div id="pair-code"></div>
      <p class="hint">两分钟内有效，只能用一次。</p>
    </section>
  </div>
  <script type="module" src="card.js"></script>
</body>
</html>
