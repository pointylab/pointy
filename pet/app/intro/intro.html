<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'">
<style>
  /* 装好 / 升级后第一次启动的开场：屏幕正中一个鲸鱼光标晃几下，指认光环弹出来套住"晃一下鼠标，指哪问哪"，4 秒后淡出。
     整个窗口点击穿透，不抢焦点。光环的样子和 overlay.html 的 #box 一致 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif; }
  #word { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; padding: 16px 30px 14px; border-radius: 14px;
    background: rgba(24, 26, 31, 0.80); backdrop-filter: blur(16px); color: #fff; white-space: nowrap; text-align: center;
    font-size: 26px; font-weight: 600; letter-spacing: 0.5px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
  #word small { display: block; margin-top: 6px; font-size: 14px; font-weight: 400; letter-spacing: 0; color: rgba(255, 255, 255, 0.7); }
  #box { position: fixed; left: 50%; top: 50%; width: 60px; height: 40px; transform: translate(-50%, -50%); opacity: 0; box-sizing: border-box;
    border: 1.5px solid rgba(138, 180, 248, 0.95); background: rgba(138, 180, 248, 0.08); border-radius: 18px;
    box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.16), 0 0 22px 6px rgba(138, 180, 248, 0.30); }
  #cursor { position: fixed; left: calc(50% + 140px); top: calc(50% + 70px); width: 64px; opacity: 0; }
  .play #cursor { animation: show 200ms forwards, shake 760ms 300ms ease-in-out, hide 300ms 3.9s forwards; }
  .play #box { animation: snap 380ms 1.1s cubic-bezier(0.34, 1.2, 0.64, 1) forwards, hide 500ms 3.9s ease-in forwards; }
  .play #word { animation: show 320ms 1.2s ease-out forwards, hide 500ms 3.9s ease-in forwards; }
  @keyframes show { to { opacity: 1; } }
  @keyframes hide { from { opacity: 1; } to { opacity: 0; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 15% { transform: translateX(-30px); } 30% { transform: translateX(26px); } 45% { transform: translateX(-22px); } 60% { transform: translateX(18px); } 75% { transform: translateX(-10px); } }
  @keyframes snap { from { opacity: 0; width: 60px; height: 40px; } to { opacity: 1; width: var(--w); height: var(--h); } }
</style>
</head>
<body>
  <div id="box"></div>
  <div id="word">晃一下鼠标，指哪问哪<small id="sub">Pointy 已就位</small></div>
  <img id="cursor" src="../../assets/cursor/cursor-64.png" alt="">
  <script src="intro.js"></script>
</body>
</html>
