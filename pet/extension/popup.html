<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; margin: 12px; font: 13px "Microsoft YaHei UI", sans-serif; color: #2b2b2b; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 18px; letter-spacing: 4px; text-align: center; }
    button { margin-top: 8px; width: 100%; padding: 6px; cursor: pointer; }
    .muted { color: #8a7a62; font-size: 12px; }
    #msg { margin-top: 6px; min-height: 1em; }
  </style>
</head>
<body>
  <div id="status">检查中……</div>
  <div id="pair-box" hidden>
    <p class="muted">点下面的按钮，屏幕右下角 Pointy 会问要不要允许连接，点「允许」。</p>
    <button id="pair" type="button">连接 Pointy</button>
  </div>
  <button id="unpair" type="button" hidden>取消配对</button>
  <div id="msg"></div>
  <details>
    <summary class="muted">高级</summary>
    <label class="muted">Pointy 端口（设了 POINTY_PORT 才需要改）
      <input id="port" inputmode="numeric" style="font-size:13px;letter-spacing:0;text-align:left">
    </label>
  </details>
  <script src="popup.js"></script>
</body>
</html>
